<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join a Game</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/logo.jpg" type="image/x-icon">
</head>
<body>
    <header>
        <img src="images/logo.jpg" alt="Charleston D&D Guildhall Logo" class="logo">
        <div class="header-text">
            <h1>Charleston D&D Guildhall</h1>
            <p>Your hub for all things Dungeons & Dragons in Charleston, South Carolina</p>
        </div>
        <img src="images/logo.jpg" alt="Charleston D&D Guildhall Logo" class="logo">
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="store.html">Homebrew</a></li>
            <li><a class="active" href="games.html">Join a Game</a></li>
            <li><a href="events.html">Community Events</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </ul>
    </nav>
    <main>
        <h1>Apply to Join a Game</h1>
        <form id="join-game-form" action="#" method="post">
            <label>
                Game You Want to Join:
                <input type="text" id="game-name" name="game" required readonly>
            </label>
            <label>
                Your Name:
                <input type="text" name="name" required>
            </label>
            <label>
                Email Address:
                <input type="email" name="email" required>
            </label>
            <label>
                Experience Level:
                <select name="experience" required>
                    <option value="">Select...</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="experienced">Experienced</option>
                </select>
            </label>
            <label>
                Experience with Character Creation:
                <select name="character" required>
                    <option value="">Select...</option>
                    <option value="beginner">I have never made a character before</option>
                    <option value="intermediate">I could use some help</option>
                    <option value="experienced">I know how to make a character</option>
                </select>
            </label>
            <label>
                Preferred Party Role:
                <select name="party-role" required>
                    <option value="">Select...</option>
                    <option value="tank">Tank</option>
                    <option value="healer">Healer</option>
                    <option value="damage-dealer">Damage Dealer</option>
                    <option value="support">Support</option>
                    <option value="flexible">Flexible</option>
                </select>
            </label>
            <label>
                Why do you want to join this game and what do you hope to gain from it?:
                <textarea name="message" rows="5" required></textarea>
            </label>
            <label>
                Do you have a character sheet ready?
                <select name="character-sheet-ready" required>
                    <option value="">Select...</option>
                    <option value="yes">Yes</option>
                    <option value="no">No</option>
                </select>
            </label>
            <label>
                Character Name (if applicable):
                <input type="text" name="character-name">
            </label>
            <label>
                Attach Character Sheet (if applicable):
                <input type="file" name="character-sheet" accept=".pdf,.doc,.docx,.txt">
            </label>
            <label>
                Attach Character Backstory (if applicable):
                <input type="file" name="character-backstory" accept=".pdf,.doc,.docx,.txt">
            </label>
            <button type="submit">Submit Application</button>
            <button type="button" id="cancel-btn">Cancel</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2025 Melissa A. Harness</p>
    </footer>
    <script>
    // Autofill the game name from the URL query string
    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const game = params.get('game');
        if (game) {
            document.getElementById('game-name').value = decodeURIComponent(game.replace(/\+/g, ' '));
        }

        // Cancel button
        document.getElementById('cancel-btn').addEventListener('click', function() {
            window.location.href = 'games.html';
        });

        // Conditional required fields
        const charSheetSelect = document.querySelector('select[name="character-sheet-ready"]');
        const charName = document.querySelector('input[name="character-name"]');
        const charSheet = document.querySelector('input[name="character-sheet"]');
        const charBackstory = document.querySelector('input[name="character-backstory"]');

        function updateRequiredFields() {
            const isYes = charSheetSelect.value === 'yes';
            charName.required = isYes;
            charSheet.required = isYes;
            charBackstory.required = isYes;
        }

        charSheetSelect.addEventListener('change', updateRequiredFields);

        // Run on page load in case of autofill
        updateRequiredFields();
    });
    </script>
</body>
</html>
